[FREELOADER]
DefaultOS=LiveImg_RamDisk_Normal
TimeOut=5

[Display]
TitleText=NextNT
MinimalUI=Yes

[Operating Systems]
LiveImg_RamDisk_Normal="NextNT"
; ROSCONFIG_PROFILE_OS_ENTRIES

[LiveImg_RamDisk_Normal]
BootType=Windows2003
SystemPath=ramdisk(0)\Windows
BootLogo=NextNT
Options=/KERNEL=ntkrnlmp.exe /FASTDETECT /MININT /RDPATH= /RDRAMSIZE=64M

; ROSCONFIG_PROFILE_BOOT_ENTRIES
